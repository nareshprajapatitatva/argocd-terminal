apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nodejs-hello-world
  namespace: argocd
  # Finalizer to ensure resources are deleted when application is deleted
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Replace this with your actual Git repository URL (e.g., https://github.com/your-username/nodejs-argocd.git)
    repoURL: https://github.com/your-username/your-repo.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: nodejs-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
