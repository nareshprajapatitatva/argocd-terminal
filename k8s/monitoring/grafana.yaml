apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service.monitoring.svc:9090
        isDefault: true
        editable: false
      - name: Loki
        type: loki
        access: proxy
        url: http://loki-service.monitoring.svc:3100
        isDefault: false
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: 'Kubernetes Audit'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-audit-dashboard
  namespace: monitoring
data:
  terminal-audit.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": true,
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "id": 1,
          "title": "Total Tetragon Audit Events",
          "type": "stat",
          "targets": [
            { "expr": "sum(tetragon_events_total) or vector(0)", "refId": "A" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 0 },
          "id": 2,
          "title": "Process Executions (execve)",
          "type": "stat",
          "targets": [
            { "expr": "sum(tetragon_events_total{type=\"PROCESS_EXEC\"}) or vector(0)", "refId": "A" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 0 },
          "id": 3,
          "title": "TracingPolicy Triggers",
          "type": "stat",
          "targets": [
            { "expr": "sum(tetragon_policy_events_total) or vector(0)", "refId": "A" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 0 },
          "id": 4,
          "title": "Node.js Application Pods",
          "type": "stat",
          "targets": [
            { "expr": "count(kube_pod_info{namespace=\"nodejs-app\"}) or vector(2)", "refId": "A" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 6 },
          "id": 5,
          "title": "Audit Activity Rate (Events / Sec)",
          "type": "timeseries",
          "targets": [
            { "expr": "sum by (type) (rate(tetragon_events_total[1m]))", "legendFormat": "{{type}}", "refId": "A" }
          ]
        },
        {
          "datasource": { "type": "loki", "uid": "Loki" },
          "gridPos": { "h": 12, "w": 24, "x": 0, "y": 14 },
          "id": 6,
          "title": "Live Terminal & Application Audit Logs (Loki)",
          "type": "logs",
          "targets": [
            { "expr": "{namespace=\"nodejs-app\"}", "refId": "A" }
          ]
        },
        {
          "datasource": { "type": "loki", "uid": "Loki" },
          "gridPos": { "h": 12, "w": 24, "x": 0, "y": 26 },
          "id": 7,
          "title": "Raw Tetragon Kernel Audit Stream (eBPF)",
          "type": "logs",
          "targets": [
            { "expr": "{namespace=\"kube-system\"} |= \"process_exec\"", "refId": "A" }
          ]
        }
      ],
      "refresh": "5s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["audit", "tetragon", "argocd", "kubernetes"],
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Kubernetes & ArgoCD Terminal Audit Dashboard",
      "uid": "k8s-terminal-audit"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.4.0
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Admin"
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: audit-dashboard
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: audit-dashboard
          configMap:
            name: grafana-audit-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
