apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: terminal-command-audit
spec:
  # Target only the pods belonging to our Node.js application
  podSelector:
    matchLabels:
      app: nodejs-hello-world
  kprobes:
    # 1. Capture external commands executed inside the container
    # Exclude the node binary itself so normal server operation does not generate noise
    - call: "sys_execve"
      syscall: true
      args:
        - index: 0
          type: "string" # Path of the executed binary
      selectors:
        - matchBinaries:
            - operator: "NotIn"
              values:
                - "/usr/local/bin/node"
                - "/usr/bin/node"
          matchActions:
            - action: Post

    # 2. Capture all 'cd' directory navigation inside the terminal
    - call: "sys_chdir"
      syscall: true
      args:
        - index: 0
          type: "string" # Directory path navigated to
      selectors:
        - matchActions:
            - action: Post
