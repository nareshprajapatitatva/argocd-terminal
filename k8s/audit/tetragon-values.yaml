# Tetragon Helm values optimized for Minikube and local development
tetragon:
  securityContext:
    # Disable native appArmorProfile to avoid schema validation errors on K8s < 1.30
    appArmorProfile: null

  enableK8sAPI: true
  enablePolicyFilter: true

  # COMPLETE SILENCE / ZERO LOGS MODE:
  # Setting an empty allowlist tells Tetragon to drop 100% of events.
  # Zero logs will be emitted to stdout or exported until you explicitly add an event or namespace.
  exportAllowList: |
    {"namespace": ["none"]}

# Disable tetragon-operator: daemonset handles all eBPF tracing policies and event generation
# Disabling saves cluster memory and prevents operator crashloops on local clusters
tetragonOperator:
  enabled: false


