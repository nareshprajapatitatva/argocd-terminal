apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-fluent-bit-config
  namespace: kube-system
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf

    # 1. Ingest ArgoCD Server Audit Logs (Records "WHO" connected)
    [INPUT]
        Name              tail
        Tag               audit.argocd
        Path              /var/log/containers/argocd-server*.log
        Parser            docker
        DB                /var/log/flb_argocd.db
        Mem_Buf_Limit     5MB

    # 2. Ingest Tetragon eBPF Kernel Logs (Records "WHAT" commands were run)
    [INPUT]
        Name              tail
        Tag               audit.tetragon
        Path              /var/log/containers/tetragon*.log
        Parser            docker
        DB                /var/log/flb_tetragon.db
        Mem_Buf_Limit     10MB

    # Filter to only capture terminal exec sessions from ArgoCD
    [FILTER]
        Name    grep
        Match   audit.argocd
        Regex   log (exec|terminal)

    # 3. Ship to Centralized SIEM / Log Analytics (Elasticsearch, Splunk, Loki, Datadog)
    [OUTPUT]
        Name            es
        Match           audit.*
        Host            elasticsearch.logging.svc.cluster.local
        Port            9200
        Index           k8s-terminal-audit
        Type            _doc
        Suppress_Type_Name On
