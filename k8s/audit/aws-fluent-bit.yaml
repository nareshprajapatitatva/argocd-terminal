# ==============================================================================
# AWS Fluent Bit Log Shipper for Terminal Command Audit
# Ships Tetragon eBPF kernel audit logs directly to AWS CloudWatch Logs
# ==============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-fluent-bit
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aws-fluent-bit-role
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aws-fluent-bit-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aws-fluent-bit-role
subjects:
  - kind: ServiceAccount
    name: aws-fluent-bit
    namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aws-fluent-bit-config
  namespace: kube-system
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf

    # 1. Tail Tetragon export-stdout container log files
    [INPUT]
        Name              tail
        Tag               tetragon.audit
        Path              /var/log/pods/kube-system_tetragon*/*export*/*.log
        Parser            docker
        DB                /tmp/flb_tetragon.db
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On
        Refresh_Interval  5

    # 2. Extract inner Tetragon JSON string from container "log" field
    [FILTER]
        Name              parser
        Match             tetragon.audit
        Key_Name          log
        Parser            json_inner
        Reserve_Data      On

    # 3. Security Guard: Ensure we strictly ship only nodejs-app terminal events
    [FILTER]
        Name              grep
        Match             tetragon.audit
        Regex             process_exec['process']['pod']['namespace'] ^nodejs-app$

    # 4. Format message to clean audit line: [Session: <id>] <pod> -> <binary> <args>
    [FILTER]
        Name              lua
        Match             tetragon.audit
        Script            format_audit.lua
        Call              format_message

    # 5. Ship directly to AWS CloudWatch Logs (or LocalStack via endpoint env)
    [OUTPUT]
        Name              cloudwatch_logs
        Match             tetragon.audit
        region            us-east-1
        log_group_name    /aws/eks/audit/terminal-commands
        log_stream_prefix audit-
        auto_create_group true
        endpoint          localstack.localstack.svc.cluster.local
        port              4566

  format_audit.lua: |
    function format_message(tag, timestamp, record)
        local proc = record["process_exec"] and record["process_exec"]["process"]
        if proc then
            local session_id = proc["parent_exec_id"] or "unknown"
            local pod = (proc["pod"] and proc["pod"]["name"]) or "unknown"
            local binary = proc["binary"] or ""
            local args = proc["arguments"] or ""
            
            local clean_line = string.format("[Session: %s] %s -> %s %s", session_id, pod, binary, args)
            return 1, timestamp, { log = clean_line }
        end
        return 0, timestamp, record
    end

  parsers.conf: |
    [PARSER]
        Name        docker
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On

    [PARSER]
        Name        json_inner
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: aws-fluent-bit
  namespace: kube-system
  labels:
    app.kubernetes.io/name: aws-fluent-bit
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: aws-fluent-bit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aws-fluent-bit
    spec:
      serviceAccountName: aws-fluent-bit
      containers:
        - name: aws-fluent-bit
          # Official AWS-optimized Fluent Bit image with native CloudWatch plugin
          image: public.ecr.aws/aws-observability/aws-for-fluent-bit:2.32.4
          imagePullPolicy: IfNotPresent
          env:
            - name: AWS_REGION
              value: "us-east-1"
            # Point to local LocalStack instance for local testing
            # (In production EKS, remove this or leave empty to use real AWS CloudWatch)
            - name: AWS_CLOUDWATCH_ENDPOINT
              value: "http://localstack.localstack.svc.cluster.local:4566"
            - name: AWS_ACCESS_KEY_ID
              value: "test"
            - name: AWS_SECRET_ACCESS_KEY
              value: "test"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: aws-fluent-bit-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
